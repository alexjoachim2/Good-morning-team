name: Refresh and publish Creative Library
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: creative-library-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh reading feed
        run: python scripts/update_feed.py
      - name: Assemble website
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/weekly.json _site/data/weekly.json
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
